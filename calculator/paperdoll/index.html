<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="../../compendium/favicon-32.png">
<title>RimStream Paper Doll</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #0a0605; --panel: #170c0b; --panel-2: #1f1110;
    --ink: #eae2d0; --ink-dim: #a89c86; --ink-faint: #867e6e;
    --accent: #b8352c; --accent-text: #c75f58; --accent-soft: #7a221c;
    --rule: #3d1f1c; --rule-soft: #26130f;
    --gold: #e6bd52; --good: #7fb069; --bad: #d9675d;
    --cand: #4fd0e0;          /* the piece you are trying on */
    --conflict: #ff4d3d;      /* clashes */
    --skin: #c99b7b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body {
    background-image:
      radial-gradient(ellipse 900px 700px at 0% 20%, rgba(184,53,44,.09), transparent 60%),
      radial-gradient(ellipse 900px 700px at 100% 80%, rgba(184,53,44,.07), transparent 60%);
    background-attachment: fixed; min-height: 100vh;
  }
  h1, h2, h3, .display { font-family: 'Arvo', Georgia, serif; margin: 0; }
  a { color: inherit; }
  button, select, input { font-family: inherit; }

  header { background: #000; border-bottom: 1px solid var(--rule); padding: 0 16px 14px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; max-width: 1600px;
    margin: 0 auto; gap: 16px; flex-wrap: wrap; padding: 14px 0; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand img { height: 34px; border-radius: 4px; display: block; }
  .brand-text { font-family: 'Arvo', Georgia, serif; font-weight: 700; font-size: 1.3rem; }
  .site-nav { display: flex; gap: 18px; font-size: .85rem; flex-wrap: wrap; }
  .site-nav a { color: var(--ink-dim); text-decoration: none; border-bottom: 1px solid transparent; }
  .site-nav a:hover { color: var(--accent-text); border-bottom-color: var(--accent); }
  .site-nav .current { color: var(--ink); font-weight: 600; }
  .lead { max-width: 1600px; margin: 0 auto; font-size: .85rem; color: var(--ink-faint); }

  main { max-width: 1600px; margin: 0 auto; padding: 16px; display: grid; gap: 16px;
    grid-template-columns: minmax(0, 1fr); align-items: start; }
  main > * { min-width: 0; }
  @media (min-width: 1150px) { main { grid-template-columns: 290px minmax(0, 1fr) 390px; } }

  .panel { background: var(--panel); border: 1px solid var(--rule-soft); border-radius: 8px; padding: 14px; }
  .panel h2 { font-size: 1rem; margin-bottom: 10px; }
  .muted { color: var(--ink-dim); } .faint { color: var(--ink-faint); } .small { font-size: .78rem; }
  .up { color: var(--good); } .down { color: var(--bad); }

  /* ---- buttons / inputs ---- */
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab { flex: 1; padding: 7px 4px; font-size: .82rem; font-weight: 600; color: var(--ink-dim);
    background: transparent; border: 1px solid var(--rule); border-radius: 5px; cursor: pointer; }
  .tab:hover { border-color: var(--accent-soft); }
  .tab[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  .field { padding: 7px 9px; color: var(--ink); background: var(--bg); border: 1px solid var(--rule);
    border-radius: 5px; font-size: .84rem; max-width: 100%; }
  .field:focus { outline: none; border-color: var(--accent-soft); }
  select.field { padding-right: 4px; }
  .copy-btn { font-size: .85rem; font-weight: 600; color: var(--ink); background: var(--accent-soft);
    border: 1px solid var(--accent); border-radius: 4px; padding: 7px 14px; cursor: pointer; }
  .copy-btn:hover { background: var(--accent); }
  .copy-btn.copied { background: #2f5d2e; border-color: #4f8d4d; }
  .swap-btn { background: #6b2a14; border-color: var(--conflict); }
  .swap-btn:hover { background: #8a3418; }
  .ghost-btn { font-size: .82rem; color: var(--ink); background: transparent; border: 1px solid var(--rule);
    border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  .ghost-btn:hover { border-color: var(--accent); }
  .ghost-btn.on { background: var(--accent-soft); border-color: var(--accent); }
  .mini { font-size: .72rem; padding: 3px 8px; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  .row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* ---- picker ---- */
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .filters label { font-size: .78rem; color: var(--ink-dim); display: flex; gap: 5px; align-items: center; cursor: pointer; }
  #search { width: 100%; margin-bottom: 8px; }
  #plist { max-height: 52vh; overflow-y: auto; }
  @media (min-width: 1150px) { #plist { max-height: calc(100vh - 330px); } }
  .ghead { font-size: .66rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint);
    margin: 10px 0 3px; padding-left: 4px; }
  .prow { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 6px; text-align: left;
    padding: 6px 8px; background: transparent; color: var(--ink); border: 0; border-bottom: 1px solid var(--rule-soft);
    font-size: .84rem; cursor: pointer; border-radius: 4px; }
  .prow:hover { background: var(--panel-2); }
  .prow[aria-current="true"] { background: rgba(79,208,224,.14); outline: 1px solid var(--cand); }
  .prow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { flex: none; font-size: .66rem; padding: 1px 7px; border-radius: 9px; border: 1px solid var(--rule); color: var(--ink-dim); }
  .badge.fits { color: var(--good); border-color: #3b5a30; }
  .badge.swap { color: #ffb199; border-color: #8a3418; background: rgba(255,77,61,.1); }
  .badge.worn { color: var(--gold); border-color: #6b5a22; }

  /* ---- stage ---- */
  .stage-top { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
  .seg { display: inline-flex; gap: 0; }
  .seg button { font-size: .8rem; padding: 6px 12px; color: var(--ink-dim); background: transparent;
    border: 1px solid var(--rule); cursor: pointer; }
  .seg button:first-child { border-radius: 5px 0 0 5px; } .seg button:last-child { border-radius: 0 5px 5px 0; }
  .seg button + button { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }
  .seg button:hover { color: var(--ink); }
  .ltabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .ltab { position: relative; font-size: .8rem; padding: 6px 11px; color: var(--ink-dim); background: transparent;
    border: 1px solid var(--rule); border-radius: 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .ltab:hover { border-color: var(--accent-soft); }
  .ltab[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  .ltab .n { font-size: .7rem; color: var(--ink-faint); }
  .ltab .dot { width: 8px; height: 8px; border-radius: 50%; display: none; }
  .ltab .dot.c { background: var(--cand); } .ltab .dot.x { background: var(--conflict); }
  .ltab[data-cand] .dot.c, .ltab[data-clash] .dot.x { display: inline-block; }

  .doll-wrap { position: relative; margin: 4px auto 0; max-width: 620px; }
  svg#doll { width: 100%; height: auto; display: block; }
  .reg { cursor: help; }
  .bz .zb > * { fill: var(--skin); stroke: none; }
  .bz .zs > * { fill: url(#shX); stroke: none; }
  .bz[data-shade="r"] .zs > * { fill: url(#shR); }
  .bz .zl0 > * { fill: none; stroke: #130807; stroke-width: 3; stroke-linejoin: round; }
  .zh > * { fill: rgba(0,0,0,0); stroke: none; }
  .zo > * { fill: none; stroke: none; pointer-events: none; }
  .reg[data-over="conflict"] .zo > * { fill: url(#hatch); }
  .zl > * { fill: none; stroke: transparent; stroke-width: 3; stroke-linejoin: round; pointer-events: none; }
  .reg[data-r="waist"] .zl > * { stroke: rgba(255,255,255,.28); stroke-width: 1.6; stroke-dasharray: 4 3; }
  .reg[data-line="cand"] .zl > * { stroke: var(--cand); stroke-width: 3.2; stroke-dasharray: 6 3; }
  .reg[data-line="conflict"] .zl > * { stroke: var(--conflict); stroke-width: 3.4; stroke-dasharray: none; }
  .reg[data-remove] .zl > * { stroke: #cfc7b4; stroke-dasharray: 3 4; }
  .reg[data-hl] .zl > * { stroke: var(--gold); stroke-width: 4; stroke-dasharray: none; }
  .reg:hover .zl > *, .reg.hot .zl > * { stroke: #fff; stroke-width: 3.6; stroke-dasharray: none; }
  /* garments, drawn over the pawn */
  .gm .f { fill: var(--gc); stroke: none; }
  .gm .sh { fill: url(#shX); stroke: none; }
  .gm .o { fill: none; stroke: #130807; stroke-width: 3; stroke-linejoin: round; }
  .gm .d { fill: none; stroke: rgba(0,0,0,.42); stroke-width: 2; stroke-linecap: round; }
  .gm .dh { fill: none; stroke: rgba(255,255,255,.35); stroke-width: 2; stroke-linecap: round; }
  .gm .dash { stroke-dasharray: 3 3; }
  .gm .rv { fill: rgba(255,255,255,.65); stroke: none; }
  .gm .dk { fill: rgba(0,0,0,.62); stroke: none; }
  .gm .gold { fill: #e3b94a; stroke: #130807; stroke-width: 2; }
  .gm .hb-o { fill: none; stroke: #130807; stroke-width: 10; stroke-linecap: round; }
  .gm .hb-f { fill: none; stroke: var(--gc); stroke-width: 5.5; stroke-linecap: round; }
  .gm.ghost { --gc: var(--cand); opacity: .8; }
  .gm.ghost .o { stroke: var(--cand); stroke-dasharray: 6 3; }
  .gm.removing { opacity: .35; }
  .gm.removing .o { stroke-dasharray: 3 4; }
  .gm.hl .o { stroke: var(--gold); stroke-width: 4; }
  .warn { font-size: 20px; fill: #fff; stroke: #000; stroke-width: .8px; paint-order: stroke; text-anchor: middle;
    dominant-baseline: central; pointer-events: none; display: none; }
  .reg[data-over="conflict"] .warn { display: block; }
  .lead-line { stroke: #4b3733; stroke-width: 1; }
  .lbl { cursor: help; }
  .lbl-name { font-size: 12px; fill: var(--ink-dim); }
  .lbl-val { font-size: 14px; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }
  .lbl.faintv .lbl-val { fill: var(--ink-faint); font-weight: 400; }
  .lbl.conflict .lbl-name, .lbl.conflict .lbl-val { fill: #ffb199; }
  .lbl.hot .lbl-name { fill: #fff; }
  .lbl .stk { fill: var(--ink-faint); font-size: 10.5px; }
  .lbl .dl-up { fill: var(--good); font-size: 12px; } .lbl .dl-down { fill: var(--bad); font-size: 12px; }
  @media (max-width: 760px) { .lbl-name { font-size: 15px; } .lbl-val { font-size: 17px; } .lbl .stk { font-size: 12px; } }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; font-size: .74rem; color: var(--ink-faint); margin: 2px 0 10px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1px solid #130807; }

  .clearbar { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 4px 0 12px; }
  .clear-all { font-size: 1rem; padding: 10px 26px; background: #4a1511; border-color: var(--conflict); letter-spacing: .02em; }
  .clear-all:hover:not(:disabled) { background: #7a2118; }
  .candbar { border: 1px solid var(--rule); border-radius: 8px; padding: 12px; background: #120a09; }
  .candbar.on { border-color: var(--cand); box-shadow: 0 0 12px rgba(79,208,224,.25); }
  .candbar.clash { border-color: var(--conflict); box-shadow: 0 0 12px rgba(255,77,61,.28); }
  .candbar .ttl { font-weight: 600; font-size: 1rem; }
  .candbar .line { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 8px; }
  .chipstat { font-size: .78rem; color: var(--ink-dim); background: var(--bg); border: 1px solid var(--rule-soft);
    border-radius: 5px; padding: 3px 8px; font-variant-numeric: tabular-nums; }
  .chipstat b { color: var(--ink); font-weight: 600; }
  .gold { color: var(--gold); font-variant-numeric: tabular-nums; font-weight: 600; }
  .okline { color: var(--good); font-size: .84rem; }
  .clashline { font-size: .84rem; color: #ffb199; margin-top: 4px; }
  .clashline b { color: #fff; }

  .worn h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); margin: 16px 0 6px;
    font-family: 'Inter', sans-serif; font-weight: 500; }
  .wrow { display: grid; grid-template-columns: 14px minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, .9fr) auto auto auto; gap: 8px;
    align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--rule-soft); border-radius: 4px; font-size: .84rem; }
  .wrow:hover { background: var(--panel-2); }
  .wrow .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #130807; }
  .wrow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wrow .lay { font-size: .68rem; color: var(--ink-faint); display: block; }
  .wrow select.field { padding: 4px 4px; font-size: .78rem; width: 100%; }
  .wrow a.lnk { font-size: .72rem; color: var(--ink-dim); }
  .xbtn { background: transparent; color: var(--ink-dim); border: 1px solid var(--rule); border-radius: 4px; width: 26px; height: 26px; cursor: pointer; line-height: 1; }
  .xbtn:hover { color: #fff; border-color: var(--conflict); background: rgba(255,77,61,.12); }
  @media (max-width: 760px) {
    .wrow { grid-template-columns: 14px minmax(0, 1fr) minmax(0, 1fr) auto; }
    .wrow .nm { grid-column: 2 / 4; } .wrow .gold, .wrow a.lnk { grid-column: auto; }
  }
  .empty { color: var(--ink-faint); font-size: .85rem; padding: 14px 4px; text-align: center; }

  /* ---- stats ---- */
  .stat-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .previewing { font-size: .78rem; padding: 6px 9px; border-radius: 6px; margin-bottom: 10px; border: 1px solid var(--cand);
    background: rgba(79,208,224,.08); color: var(--ink); }
  .previewing.clash { border-color: var(--conflict); background: rgba(255,77,61,.08); }
  .previewing.rm { border-color: #cfc7b4; background: rgba(255,255,255,.04); }
  table.st { border-collapse: collapse; width: 100%; font-size: .8rem; font-variant-numeric: tabular-nums; }
  table.st th, table.st td { padding: 5px 6px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule-soft); }
  table.st th:first-child, table.st td:first-child { text-align: left; }
  table.st th { font-size: .66rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); font-weight: 500; }
  table.st tr.area { cursor: help; }
  table.st tr.area:hover, table.st tr.area.hot { background: var(--panel-2); }
  table.st td.hit { color: var(--ink-faint); font-size: .72rem; }
  table.st td.v { position: relative; }
  table.st td.v.dim { color: var(--ink-faint); }
  table.st tr.tot td { font-weight: 600; border-top: 1px solid var(--rule); }
  table.st tr.sec td { padding-top: 12px; font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); border-bottom: 0; }
  .bar { position: absolute; left: 0; top: 2px; bottom: 2px; background: rgba(184,53,44,.32); border-radius: 2px; z-index: 0; }
  .bar.blunt { background: rgba(196,150,60,.30); } .bar.heat { background: rgba(217,120,50,.32); }
  td.v > span { position: relative; z-index: 1; }
  .delta { font-size: .68rem; margin-left: 4px; }
  .note { font-size: .74rem; color: var(--ink-faint); margin-top: 10px; line-height: 1.45; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .apbox { display: flex; gap: 8px; align-items: center; font-size: .78rem; color: var(--ink-dim); margin-bottom: 8px; flex-wrap: wrap; }
  .tipped { cursor: help; text-decoration: underline dotted var(--ink-faint); text-underline-offset: 3px; }

  /* ---- tooltip ---- */
  .tooltip { position: fixed; left: 0; top: 0; z-index: 60; max-width: 340px; padding: 10px 12px; background: #000;
    color: var(--ink); border: 1px solid var(--accent-soft); border-radius: 6px; font-size: .78rem; line-height: 1.45;
    box-shadow: 0 8px 24px rgba(0,0,0,.6); pointer-events: none; }
  .tooltip h4 { margin: 0 0 2px; font-family: 'Arvo', Georgia, serif; font-size: .92rem; }
  .tooltip .sub { color: var(--ink-faint); font-size: .72rem; margin-bottom: 6px; }
  .tooltip .tl { display: flex; justify-content: space-between; gap: 14px; padding: 2px 0; font-variant-numeric: tabular-nums; }
  .tooltip .tl .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; border: 1px solid #130807; }
  .tooltip hr { border: 0; border-top: 1px solid var(--rule); margin: 6px 0; }
  .tooltip .selt { color: var(--gold); }
  .tooltip .cl { color: #ffb199; }
  .tooltip .quip { color: var(--gold); font-style: italic; margin: 2px 0 6px; }
  .tooltip .why { color: var(--ink-faint); font-size: .7rem; margin-top: 6px; }

  /* ---- buy dialog ---- */
  dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--accent-soft); border-radius: 10px;
    padding: 18px; width: min(640px, 94vw); box-shadow: 0 20px 60px rgba(0,0,0,.7); }
  dialog::backdrop { background: rgba(0,0,0,.65); }
  dialog h2 { font-size: 1.15rem; margin-bottom: 6px; }
  .cmdrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 7px 4px;
    border-bottom: 1px solid var(--rule-soft); }
  .cmdrow code { font-family: ui-monospace, Consolas, monospace; font-size: .86rem; background: var(--bg);
    border: 1px solid var(--rule); border-radius: 4px; padding: 4px 8px; word-break: break-all; }
  .cmdrow .who { grid-column: 1 / -1; font-size: .74rem; color: var(--ink-dim); }
  .cmdrow.done code { opacity: .5; text-decoration: line-through; }
  .cmdrow.next code { border-color: var(--accent); }
  footer { max-width: 1600px; margin: 0 auto; padding: 8px 16px 40px; font-size: .74rem; color: var(--ink-faint); }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <a class="brand" href="../../">
      <img src="../../compendium/mascot-icon.png" alt="">
      <span class="brand-text">RimStream</span>
    </a>
    <nav class="site-nav">
      <a href="../../commands">Commands</a>
      <a href="../../guide/">Guide</a>
      <a href="../../info">Info</a>
      <a href="../../modlist">Mod List</a>
      <a href="../">Gear Calculator</a>
      <span class="current">Paper Doll</span>
      <a href="../../compendium/">Store</a>
    </nav>
  </div>
  <p class="lead">Dress a pawn, see which pieces fight over the same slots, and watch your armor and insulation change as you swap materials and quality.</p>
</header>

<main>
  <section class="panel" id="picker" aria-label="Choose a piece">
    <h2>Pieces</h2>
    <div class="tabs" id="gtabs" role="tablist"></div>
    <input id="search" class="field" type="search" placeholder="Search&hellip;" autocomplete="off" aria-label="Search pieces">
    <div class="filters">
      <select id="lfilter" class="field" aria-label="Filter by layer"></select>
      <label><input type="checkbox" id="fitonly"> Only what fits</label>
    </div>
    <div id="plist"></div>
  </section>

  <section class="panel" id="stage" aria-label="Pawn">
    <div class="stage-top">
      <div class="seg" id="otabs" role="group" aria-label="Outfit"></div>
      <div class="seg" id="dmgtog" role="group" aria-label="Damage type shown on the doll"></div>
    </div>
    <div class="ltabs" id="ltabs" role="tablist" aria-label="Layer"></div>
    <div class="doll-wrap"><svg id="doll" viewBox="0 0 520 452" role="img" aria-label="Pawn with armor zones"></svg></div>
    <div class="legend">
      <span><i style="background:var(--skin)"></i>Empty</span>
      <span><i style="background:#e6bd52"></i>Worn (one colour per piece)</span>
      <span><i style="background:var(--cand)"></i>Trying on</span>
      <span><i style="background:repeating-linear-gradient(45deg,#7a1010 0 3px,#ff3b30 3px 6px)"></i>Clash</span>
    </div>
    <div class="clearbar" id="clearbar"></div>
    <div class="candbar" id="cand"></div>
    <div class="worn"><h3>Worn</h3><div id="worn"></div></div>
  </section>

  <aside class="panel" id="statpanel" aria-label="Outfit stats"></aside>
</main>
<footer id="footer"></footer>

<dialog id="buy"></dialog>

<script src="../calc-core.js"></script>
<script>
'use strict';

// ================================================================ constants
const TYPES = ['sharp', 'blunt', 'heat'];
const TYPE_LABEL = { sharp: 'Sharp', blunt: 'Blunt', heat: 'Heat' };
const AP_OPTIONS = [[0, 'None'], [0.15, '15%'], [0.3, '30%'], [0.5, '50%'], [0.75, '75%']];
const COMFY = { min: 16, max: 26 };            // an ordinary pawn's comfortable range, in degrees C
const SKIN = '#c99b7b';

// Which doll zone a body part belongs to (decided from the part's body-part groups, so it follows the game's data).
function regionOfPart(p) {
  const has = g => p.groups.includes(g);
  if (has('Torso')) return 'torso';
  if (has('Neck')) return 'neck';
  if (has('Shoulders')) return 'shoulders';
  if (has('Arms')) return 'arms';
  if (has('Hands') || has('LeftHand') || has('RightHand')) return 'hands';
  if (has('Waist')) return 'waist';
  if (has('Legs')) return 'legs';
  if (has('Feet')) return 'feet';
  if (has('UpperHead')) return 'head';
  if (has('Eyes')) return 'eyes';
  if (has('FullHead')) return 'face';
  return null;
}

// ================================================================ state
const byDef = {};
let PARTS = [], REGION = {}, LAYER = {}, APPAREL = [];
const state = {

  view: 'all', dmg: 'sharp', ap: 0,
  cand: null, hover: null, hoverWorn: null, hoverRemove: null, hotRegion: null,
  live: new Set(),          // why the try-on piece is on the pawn: 'picker', 'candHover', 'candFocus', 'arrived'
  undo: null,               // {index, entries} from "Remove all clothing"

};

// ================================================================ data prep
function prepare() {
  PARTS = DATA.body.map(p => Object.assign({}, p, { region: null }));
  PARTS.forEach(p => { p.region = regionOfPart(p); p.gset = new Set(p.groups); });
  REGION_DEFS.forEach(r => { r.parts = []; r.w = 0; });
  for (const r of REGION_DEFS) REGION[r.id] = r;
  PARTS.forEach((p, i) => { if (p.region) { REGION[p.region].parts.push(i); REGION[p.region].w += p.w; } });
  REGION_DEFS.forEach(r => { r.equal = r.w <= 0; });
  for (const l of DATA.layers) LAYER[l.id] = l;
  for (const it of DATA.items) {
    byDef[it.def] = it;
    if (it.apparel) {
      it._cov = PARTS.map(p => it.apparel.groups.some(g => p.gset.has(g)));
      it._rc = {};
      for (const r of REGION_DEFS) {
        let hit = 0, tot = 0;
        for (const i of r.parts) { const w = r.equal ? 1 : PARTS[i].w; tot += w; if (it._cov[i]) hit += w; }
        it._rc[r.id] = tot ? hit / tot : 0;
      }
      APPAREL.push(it);
    }
  }
  APPAREL.sort((a, b) => layerSig(a).order - layerSig(b).order || layerSig(a).text.localeCompare(layerSig(b).text) || a.label.localeCompare(b.label));
}
function layerName(id) { return title((LAYER[id] || { label: id.replace(/^TM_/, '').toLowerCase() }).label); }
function layerOrder(id) { return (LAYER[id] || { order: 250 }).order; }
function layerSig(item) {
  const ls = item.apparel.layers.slice().sort((a, b) => layerOrder(a) - layerOrder(b));
  return { text: ls.map(layerName).join(' + '), order: layerOrder(ls[0]) * 10 + ls.length };
}
const defMat = item => item.madeFromStuff ? statKey(item, '') : '';
function mkEntry(def, mat, q) {
  const item = byDef[def];
  return { id: state.nextId++, def,
    mat: item.madeFromStuff ? (item.mats.includes(mat) ? mat : defMat(item)) : '',
    q: item.hasQuality && QUALITY_ORDER.includes(q) ? q : 'std' };
}
const itemOf = e => byDef[e.def];
const entryLabel = e => itemName(itemOf(e).label);
const pieceStats = e => compute(itemOf(e), e.mat, e.q);

// ================================================================ clash rules
// Two pieces clash when they share an apparel layer AND both cover some body part (the game's own rule).
function clashInfo(a, b) {
  const layers = a.apparel.layers.filter(l => b.apparel.layers.includes(l));
  if (!layers.length) return null;
  const regions = new Set();
  for (let i = 0; i < PARTS.length; i++) if (a._cov[i] && b._cov[i]) regions.add(PARTS[i].region);
  regions.delete(null);
  return regions.size ? { layers, regions } : null;
}
function clashesOf(item, entries) {
  const out = [];
  for (const e of entries) { const info = clashInfo(item, itemOf(e)); if (info) out.push({ entry: e, info }); }
  return out;
}
const regionList = set => REGION_DEFS.filter(r => set.has(r.id)).map(r => r.label.toLowerCase()).join(', ');

// ================================================================ armor maths
// One layer of armor rolls on every hit: below half its rating the hit is absorbed, below the full rating the damage
// is halved, otherwise it lands. Armor penetration is subtracted from the rating first. Layers roll one after another,
// outermost first, so the average damage that gets through compounds layer by layer.
// Two refinements from the game's rules: a sharp hit that one layer halves becomes blunt, so the layers beneath
// judge it by their blunt rating; and heat damage ignores armor penetration.
const halfChance = x => Math.min(x, 1) - Math.min(x / 2, 1);
function passThrough(rating, ap) {
  const x = Math.max(0, rating - ap);
  return halfChance(x) * 0.5 + (1 - Math.min(x, 1));
}
// Average share of damage that gets past every layer covering one body part, working from the outside in.
function partPass(covering, type, ap) {
  const layers = covering.slice().sort((a, b) => outermost(b.item) - outermost(a.item));
  if (type === 'heat') ap = 0;
  if (type !== 'sharp') { let p = 1; for (const pc of layers) p *= passThrough(pc.st[type] || 0, ap); return p; }
  let stillSharp = 1, nowBlunt = 1;                     // expected damage left, given the hit is sharp / has turned blunt
  for (let k = layers.length - 1; k >= 0; k--) {
    const xs = Math.max(0, (layers[k].st.sharp || 0) - ap), xb = Math.max(0, (layers[k].st.blunt || 0) - ap);
    stillSharp = halfChance(xs) * 0.5 * nowBlunt + (1 - Math.min(xs, 1)) * stillSharp;
    nowBlunt = nowBlunt * (halfChance(xb) * 0.5 + (1 - Math.min(xb, 1)));
  }
  return stillSharp;
}
function regionValue(pieces, rid, type, ap) {
  const R = REGION[rid];
  let num = 0, den = 0;
  for (const i of R.parts) {
    const w = R.equal ? 1 : PARTS[i].w;
    num += w * (1 - partPass(pieces.filter(pc => pc.item._cov[i]), type, ap)); den += w;
  }
  return den ? num / den : 0;
}
function outfitStats(entries, ap) {
  const pieces = entries.map(e => ({ e, item: itemOf(e), st: pieceStats(e) }));
  const out = { pieces, region: {}, overall: {}, cold: 0, warm: 0, price: 0, mass: 0, bonus: [] };
  for (const t of TYPES) out.overall[t] = 0;
  for (const R of REGION_DEFS) {
    const here = pieces.filter(pc => pc.item._rc[R.id] > 0);
    const rec = { here, cover: here.length ? Math.max(...here.map(pc => pc.item._rc[R.id])) : 0 };
    for (const t of TYPES) {
      rec[t] = regionValue(pieces, R.id, t, ap);
      out.overall[t] += R.w * rec[t];
    }
    out.region[R.id] = rec;
  }
  const bonus = {};
  for (const pc of pieces) {
    out.cold += pc.st.cold || 0; out.warm += pc.st.warm || 0; out.mass += pc.st.mass || 0;
    out.price += priceOf(pc.item, pc.e.mat, pc.e.q);
    for (const fx of pc.item.effects || []) {
      const k = fx.label + '|' + fx.unit;
      (bonus[k] = bonus[k] || { label: fx.label, unit: fx.unit, value: 0, better: fx.better }).value += fx.value;
    }
  }
  out.bonus = Object.values(bonus).filter(b => Math.abs(b.value) > 1e-9);
  return out;
}

// ================================================================ what the page is showing right now
function previewAdd() {
  if (state.hover) {
    if (state.cand && state.cand.def === state.hover) return Object.assign({ id: -1 }, state.cand);
    const it = byDef[state.hover];
    return { id: -1, def: it.def, mat: defMat(it), q: 'std' };
  }
  return state.cand && state.live.size ? Object.assign({ id: -1 }, state.cand) : null;
}
function computeView() {
  const base = state.outfits[state.active];
  const add = previewAdd();
  const removeEntry = state.hoverRemove != null ? base.find(e => e.id === state.hoverRemove) || null : null;
  let after = removeEntry ? base.filter(e => e !== removeEntry) : base.slice();
  let clashes = [];
  if (add) {
    clashes = clashesOf(byDef[add.def], after);
    after = after.filter(e => !clashes.some(c => c.entry === e)).concat([add]);
  }
  return { base, add, addItem: add ? byDef[add.def] : null, removeEntry, clashes, after, changed: !!(add || removeEntry) };
}

// ================================================================ outfit editing
function equip(cand) {
  const out = state.outfits[state.active];
  const item = byDef[cand.def];
  const gone = new Set(clashesOf(item, out).map(c => c.entry));
  state.outfits[state.active] = out.filter(e => !gone.has(e)).concat([mkEntry(cand.def, cand.mat, cand.q)]);
  state.cand = null; state.hover = null; state.undo = null; state.live.clear();
  renderAll();
}
function removeWorn(id) {
  state.outfits[state.active] = state.outfits[state.active].filter(e => e.id !== id);
  state.hoverRemove = null; state.hoverWorn = null; state.undo = null;
  renderAll();
}
function clearAll() {
  const i = state.active, had = state.outfits[i];
  if (!had.length) return;
  state.undo = { index: i, entries: had };
  state.outfits[i] = []; state.hoverRemove = null; state.hoverWorn = null;
  renderAll();
}
function undoClear() {
  if (!state.undo) return;
  state.outfits[state.undo.index] = state.undo.entries; state.undo = null;
  renderAll();
}
function renderClearBar() {
  const out = state.outfits[state.active];
  const kids = [el('button', { class: 'copy-btn clear-all', type: 'button', text: 'Remove all clothing', disabled: !out.length,
    'data-tip': 'Takes everything off ' + OUTFIT_NAME[state.active] + '. You can undo it right after.', onclick: clearAll })];
  if (state.undo && state.undo.index === state.active) kids.push(el('button', { class: 'ghost-btn', type: 'button', text: 'Undo', onclick: undoClear }));
  document.getElementById('clearbar').replaceChildren(...kids);
}

// ================================================================ persistence + sharing
const encodeOutfit = list => list.map(e => [e.def, e.mat, e.q].join(':')).join(',');
function decodeOutfit(s) {
  const out = [];
  for (const part of (s || '').split(',')) {
    const [def, mat, q] = part.split(':');
    if (!def || !byDef[def] || !byDef[def].apparel) continue;
    const e = mkEntry(def, mat, q);
    if (!clashesOf(byDef[def], out).length) out.push(e);   // drop anything that can't be worn together
  }
  return out;
}
function paramString() {
  const p = new URLSearchParams();
  if (state.outfits[0].length) p.set('a', encodeOutfit(state.outfits[0]));
  if (state.outfits[1].length) p.set('b', encodeOutfit(state.outfits[1]));
  if (state.active) p.set('act', 'b');
  if (state.compare) p.set('cmp', '1');
  if (state.dmg !== 'sharp') p.set('dmg', state.dmg);
  if (state.ap) p.set('ap', String(state.ap));
  return p.toString();
}
function syncUrl() {
  const qs = paramString();
  try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); } catch (e) { /* ignore */ }
  try { localStorage.setItem(STORE_KEY, qs); } catch (e) { /* ignore */ }
}
function loadParams(qs) {
  const p = new URLSearchParams(qs);
  state.outfits = [decodeOutfit(p.get('a')), decodeOutfit(p.get('b'))];
  state.active = p.get('act') === 'b' ? 1 : 0;
  state.compare = p.get('cmp') === '1';
  state.dmg = TYPES.includes(p.get('dmg')) ? p.get('dmg') : 'sharp';
  const ap = parseFloat(p.get('ap'));
  state.ap = AP_OPTIONS.some(o => o[0] === ap) ? ap : 0;
}

// ================================================================ tooltips
const tipBox = el('div', { class: 'tooltip', role: 'tooltip', hidden: true });
document.body.append(tipBox);
function placeTip(x, y) {
  const b = tipBox.getBoundingClientRect();
  let left = x + 16, top = y + 16;
  if (left + b.width > innerWidth - 8) left = Math.max(8, x - b.width - 16);
  if (top + b.height > innerHeight - 8) top = Math.max(8, innerHeight - b.height - 8);
  tipBox.style.left = left + 'px'; tipBox.style.top = top + 'px';
}
function showTip(node, x, y) {
  tipBox.replaceChildren(node);
  tipBox.hidden = false;
  tipBox.style.left = '0px'; tipBox.style.top = '0px';
  placeTip(x, y);
}
function hideTip() { tipBox.hidden = true; }
document.addEventListener('mouseover', e => {
  const t = e.target.closest ? e.target.closest('[data-tip]') : null;
  if (!t) return;
  showTip(el('div', { text: t.getAttribute('data-tip') }), e.clientX, e.clientY);
});
document.addEventListener('mousemove', e => {
  if (tipBox.hidden) return;
  if (e.target.closest && (e.target.closest('[data-tip]') || e.target.closest('.reg') || e.target.closest('.lbl') || e.target.closest('tr.area'))) placeTip(e.clientX, e.clientY);
});
document.addEventListener('mouseout', e => {
  const t = e.target.closest ? e.target.closest('[data-tip]') : null;
  if (t && !(e.relatedTarget && t.contains(e.relatedTarget))) hideTip();
});
document.addEventListener('scroll', hideTip, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });

const pctTxt = v => Math.round(v * 100) + '%';
const ptsTxt = d => (d > 0 ? '+' : '−') + Math.abs(Math.round(d * 100)) + ' pts';

// The mouseover breakdown for one body area: which pieces protect it and how much each one adds.
function regionTip(rid) {
  const view = computeView(), R = REGION[rid];
  const before = outfitStats(view.base, state.ap), reg = before.region[rid];
  const t = state.dmg;
  const box = el('div');
  box.append(el('h4', { text: R.label }),
    el('div', { class: 'sub', text: (R.sub ? R.sub + ' · ' : '') + (R.w > 0 ? 'takes about ' + Math.round(R.w * 100) + '% of hits' : 'a slot only, never struck') }));
  if (R.quip) box.append(el('div', { class: 'quip', text: R.quip }));
  if (!reg.here.length) {
    box.append(el('div', { class: 'faint', text: 'Nothing covers this area.' }));
  } else {
    box.append(el('div', { class: 'tl' }, el('span', { text: 'Damage absorbed on average' }),
      el('span', { text: TYPES.map(x => TYPE_LABEL[x][0] + ' ' + pctTxt(reg[x])).join(' · ') })));
    box.append(el('hr'));
    const ordered = reg.here.slice().sort((a, b) => Math.max(...b.item.apparel.layers.map(layerOrder)) - Math.max(...a.item.apparel.layers.map(layerOrder)));
    for (const pc of ordered) {
      const rest = reg.here.filter(x => x !== pc);
      const marginal = reg[t] - regionValue(rest, rid, t, state.ap);
      const color = PALETTE[pc.e.id % PALETTE.length];
      box.append(el('div', { class: 'tl' },
        el('span', null, el('i', { class: 'sw', style: 'background:' + color }), entryLabel(pc.e),
          el('span', { class: 'faint', text: ' · ' + pc.item.apparel.layers.map(layerName).join('+').toLowerCase() })),
        el('span', { class: 'selt', text: 'rating ' + pctTxt(pc.st[t] || 0) + ' · adds ' + ptsTxt(marginal) })));
    }
    if (reg.cover < 0.999) box.append(el('div', { class: 'faint', text: 'Only part of this area is covered (' + Math.round(reg.cover * 100) + '%).' }));
    box.append(el('div', { class: 'why', text: 'Each layer gets its own roll to block or halve a hit, so layers add less than their ratings sum to' + (t === 'sharp' ? ' (and a sharp hit that gets halved turns blunt for the layers beneath)' : '') + '. “Adds” is what that piece contributes on top of the others.' }));
  }
  for (const c of view.clashes) if (c.info.regions.has(rid)) {
    box.append(el('hr'), el('div', { class: 'cl', text: '⚠ ' + entryLabel(view.add) + ' clashes with ' + entryLabel(c.entry) + ' here (' + c.info.layers.map(layerName).join(', ').toLowerCase() + ' layer).' }));
  }
  if (view.changed) {
    const after = outfitStats(view.after, state.ap);
    box.append(el('hr'), el('div', { class: 'tl' }, el('span', { text: 'After this change (' + TYPE_LABEL[t].toLowerCase() + ')' }),
      el('span', { text: pctTxt(before.region[rid][t]) + ' → ' + pctTxt(after.region[rid][t]) })));
  }
  return box;
}

// pawn in the piece's colour, and armor gets plate styling while clothing gets soft styling.
const GP = (d, eo) => ['f', 'sh', 'o'].map(c => '<path class="' + c + '"' + (eo ? ' fill-rule="evenodd"' : '') + ' d="' + d + '"/>').join('');
const GL = (d, dash) => '<path class="d' + (dash ? ' dash' : '') + '" d="' + d + '"/>';
const GH = d => '<path class="dh" d="' + d + '"/>';
const GR = (x, y) => '<circle class="rv" cx="' + x + '" cy="' + y + '" r="2.3"/>';
const GC = (x, y, r) => '<circle class="d" cx="' + x + '" cy="' + y + '" r="' + r + '"/>';

const gsym = m => m + '<g transform="translate(520 0) scale(-1 1)">' + m + '</g>';
const HEAD_HIDES = { hat: ['hair'], wizard: ['hair'], cap: ['hair'], helmOpen: ['hair'], helmet: ['hair', 'eyes', 'mouth'],
  hood: ['hair'], maskFull: ['eyes', 'mouth'], maskMouth: ['mouth'], blindfold: ['eyes'] };

function archetype(item) {
  if (item._arch) return item._arch;
  const A = item.apparel, g = A.groups, l = A.layers, n = item.label.toLowerCase();
  const has = x => g.includes(x), hard = item.group === 'armor';
  let kind;
  if (l.includes('Overhead') || l.includes('EyeCover')) {
    if (l.includes('EyeCover') || /blindfold/.test(n)) kind = 'blindfold';
    else if (/crown|coronet|headdress/.test(n)) kind = 'crown';
    else if (/headset|gunlink/.test(n)) kind = 'headset';
    else if (/wizard/.test(n)) kind = 'wizard';
    else if (/mask|veil|visage/.test(n)) kind = (has('FullHead') || has('Eyes')) ? 'maskFull' : 'maskMouth';
    else if (g.length === 1 && has('Neck')) kind = 'collar';
    else if (/helmet|\bhelm/.test(n) || (hard && has('UpperHead'))) kind = has('FullHead') ? 'helmet' : 'helmOpen';
    else if (has('FullHead')) kind = 'hood';
    else if (/hat|shadecone/.test(n)) kind = 'hat';
    else kind = 'cap';
  } else if (l.includes('TM_Cloak')) kind = 'cloak';
  else if (/cape/.test(n)) kind = 'cape';
  else if (/robe|shroud/.test(n)) kind = 'robe';
  else if (/vacsuit|\bsuit\b/.test(n)) kind = 'suit';
  else if (hard && has('Torso') && has('Arms') && has('Legs')) kind = 'plate';
  else if (l.includes('Middle') && l.includes('Shell') && has('Torso')) kind = 'plate';
  else if (l.includes('OnSkin') && has('Arms') && !has('Legs')) kind = 'shirt';
  else if (has('Legs') && !has('Torso')) kind = 'pants';
  else if (has('Torso') && has('Arms')) kind = 'jacket';
  else if (has('Torso')) kind = 'vest';
  else kind = 'belt';
  const head = ['blindfold', 'crown', 'headset', 'wizard', 'maskFull', 'maskMouth', 'collar', 'helmet', 'helmOpen', 'hood', 'hat', 'cap'].includes(kind);
  return (item._arch = { kind, hard, head, hides: HEAD_HIDES[kind] || [] });
}

// Draw every piece in view (inner layers first), the try-on piece as a cyan ghost, and hide hair/face where they are covered.
function drawGarments(view, hlItem) {
  const list = [];
  for (const e of view.base) if (inView(itemOf(e).apparel.layers))
    list.push({ e, item: itemOf(e), cls: e === view.removeEntry ? 'removing' : (e === hlItem ? 'hl' : '') });
  list.sort((a, b) => outermost(a.item) - outermost(b.item));
  if (view.addItem && inView(view.addItem.apparel.layers)) list.push({ e: view.add, item: view.addItem, cls: 'ghost' });
  const hidden = new Set();
  let html = '';
  for (const x of list) {
    const a = archetype(x.item);
    html += '<g class="gm ' + x.cls + '"' + (x.cls === 'ghost' ? '' : ' style="--gc:' + PALETTE[x.e.id % PALETTE.length] + '"') + '>' + garmentMarkup(x.item) + '</g>';
    if (x.cls !== 'removing') a.hides.forEach(h => hidden.add(h));
  }
  document.getElementById('garments').innerHTML = html;
  for (const k of ['hair', 'eyes', 'mouth']) { const n = document.getElementById('d-' + k); if (n) n.style.display = hidden.has(k) ? 'none' : ''; }
}

function buildDoll() {
  const svg = document.getElementById('doll');
  const wrap = (shapes, cls) => '<g class="' + cls + '">' + shapes + '</g>';
  const body = PAINT_ORDER.filter(id => id !== 'waist').map(id => {
    const R = REGION[id];
    return '<g class="bz" data-shade="' + R.shade + '">' + wrap(R.zones, 'zb') + wrap(R.zones, 'zs') + wrap(R.zones, 'zl0') + '</g>';
  }).join('');
  const zones = PAINT_ORDER.map(id => {
    const R = REGION[id];
    return '<g class="reg" data-r="' + id + '" tabindex="0">' + wrap(R.zones, 'zh') + wrap(R.zones, 'zo') + wrap(R.zones, 'zl') +
      '<text class="warn" data-w="' + id + '">⚠</text></g>';
  }).join('');
  const labels = REGION_DEFS.map(R => {
    const L = R.lbl, left = L.side === 'L', x = left ? 150 : 370, ax = left ? 156 : 364;
    return '<g class="lbl" data-l="' + R.id + '"><rect class="lbl-hit" x="' + (left ? 2 : 366) + '" y="' + (L.y - 18) + '" width="150" height="38" fill="rgba(0,0,0,0)"/>' +
      '<line class="lead-line" x1="' + ax + '" y1="' + L.y + '" x2="' + L.tx + '" y2="' + L.ty + '"/>' +
      '<text class="lbl-name" x="' + x + '" y="' + (L.y - 3) + '" text-anchor="' + (left ? 'end' : 'start') + '"></text>' +
      '<text class="lbl-val" x="' + x + '" y="' + (L.y + 13) + '" text-anchor="' + (left ? 'end' : 'start') + '"></text></g>';
  }).join('');
  svg.innerHTML =
    '<defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
    '<rect width="9" height="9" fill="#6e0f0a"/><rect width="4.5" height="9" fill="#ff3b30"/></pattern>' +
    '<linearGradient id="shX" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".32"/><stop offset=".3" stop-color="#000" stop-opacity="0"/>' +
    '<stop offset=".62" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".34"/></linearGradient>' +
    '<radialGradient id="shR" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".24"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>' +
    '<stop offset="1" stop-color="#000" stop-opacity=".36"/></radialGradient></defs>' +
    '<ellipse cx="260" cy="436" rx="96" ry="8" fill="rgba(0,0,0,.4)"/>' +
    '<g id="body">' + body + '</g><g id="decor" pointer-events="none">' + DECOR + '</g><g id="garments" pointer-events="none"></g>' +
    '<g id="zones">' + zones + '</g>' + labels;
  // warning glyph sits in the middle of each zone
  svg.querySelectorAll('.reg').forEach(g => {
    const bb = g.querySelector('.zh').getBBox(), w = g.querySelector('.warn');
    w.setAttribute('x', bb.x + bb.width / 2); w.setAttribute('y', bb.y + bb.height / 2);
    g.addEventListener('mouseenter', e => { state.hotRegion = g.dataset.r; markHot(); showTip(regionTip(g.dataset.r), e.clientX, e.clientY); });
    g.addEventListener('mouseleave', () => { state.hotRegion = null; markHot(); hideTip(); });
    g.addEventListener('focus', () => { const r = g.getBoundingClientRect(); state.hotRegion = g.dataset.r; markHot(); showTip(regionTip(g.dataset.r), r.right, r.top); });
    g.addEventListener('blur', () => { state.hotRegion = null; markHot(); hideTip(); });
  });
  svg.querySelectorAll('.lbl').forEach(g => {
    const rid = g.dataset.l;
    g.addEventListener('mouseenter', e => { state.hotRegion = rid; markHot(); showTip(regionTip(rid), e.clientX, e.clientY); });
    g.addEventListener('mouseleave', () => { state.hotRegion = null; markHot(); hideTip(); });
  });
  dollBuilt = true;
}
function markHot() {
  document.querySelectorAll('#doll .reg').forEach(g => g.classList.toggle('hot', g.dataset.r === state.hotRegion));
  document.querySelectorAll('#doll .lbl').forEach(g => g.classList.toggle('hot', g.dataset.l === state.hotRegion));
  document.querySelectorAll('tr.area').forEach(tr => tr.classList.toggle('hot', tr.dataset.r === state.hotRegion));
}
const inView = (layers) => state.view === 'all' || layers.includes(state.view);
const outermost = item => Math.max(...item.apparel.layers.map(layerOrder));

function renderDoll() {
  if (!dollBuilt) buildDoll();
  const view = computeView();
  const before = outfitStats(view.base, state.ap);
  const after = view.changed ? outfitStats(view.after, state.ap) : null;
  const t = state.dmg;
  const hlItem = state.hoverWorn != null ? view.base.find(e => e.id === state.hoverWorn) : null;
  for (const R of REGION_DEFS) {
    const g = document.querySelector('#doll .reg[data-r="' + R.id + '"]');
    const cand = !!(view.addItem && view.addItem._rc[R.id] >= SHADE_MIN && inView(view.addItem.apparel.layers));
    const clash = view.clashes.some(c => c.info.regions.has(R.id) && inView(c.info.layers));
    const removing = !!(view.removeEntry && itemOf(view.removeEntry)._rc[R.id] >= SHADE_MIN && inView(itemOf(view.removeEntry).apparel.layers));
    g.dataset.over = clash ? 'conflict' : (cand ? 'cand' : '');
    if (clash) g.dataset.line = 'conflict'; else if (cand) g.dataset.line = 'cand'; else delete g.dataset.line;
    if (removing) g.dataset.remove = '1'; else delete g.dataset.remove;
    if (hlItem && itemOf(hlItem)._rc[R.id] >= SHADE_MIN && inView(itemOf(hlItem).apparel.layers)) g.dataset.hl = '1'; else delete g.dataset.hl;

    // label: name + the figure for the chosen damage type
    const L = document.querySelector('#doll .lbl[data-l="' + R.id + '"]');
    const b = before.region[R.id], a = after ? after.region[R.id] : null;
    const nm = L.querySelector('.lbl-name'), vl = L.querySelector('.lbl-val');
    const stack = view.base.filter(e => itemOf(e)._rc[R.id] > 0).length;
    nm.textContent = (clash ? '⚠ ' : '') + R.label;
    if (stack > 1) { const sp = document.createElementNS('http://www.w3.org/2000/svg', 'tspan'); sp.setAttribute('class', 'stk'); sp.textContent = '  ×' + stack; nm.append(sp); }
    vl.replaceChildren();
    const shown = b.here.length === 0 && !(a && a.here.length);
    L.classList.toggle('faintv', shown);
    L.classList.toggle('conflict', clash);
    if (shown) { vl.textContent = R.w > 0 ? '0%' : '—'; continue; }
    if (a && Math.abs(a[t] - b[t]) >= 0.005) {
      vl.append(document.createTextNode(pctTxt(b[t]) + ' → ' + pctTxt(a[t]) + ' '));
      const sp = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
      sp.setAttribute('class', a[t] > b[t] ? 'dl-up' : 'dl-down'); sp.textContent = a[t] > b[t] ? '▲' : '▼';
      vl.append(sp);
    } else vl.textContent = pctTxt(b[t]);
  }
  drawGarments(view, hlItem);
  markHot();
}

// ================================================================ layer tabs
function renderLayerTabs() {
  const view = computeView();
  const used = DATA.layers.filter(l => APPAREL.some(i => i.apparel.layers.includes(l.id)));
  const tabs = [{ id: 'all', label: 'All layers' }].concat(used.map(l => ({ id: l.id, label: layerName(l.id) })));
  document.getElementById('ltabs').replaceChildren(...tabs.map(tb => {
    const n = tb.id === 'all' ? view.base.length : view.base.filter(e => itemOf(e).apparel.layers.includes(tb.id)).length;
    const candHere = view.addItem && (tb.id === 'all' || view.addItem.apparel.layers.includes(tb.id));
    const clashHere = view.clashes.some(c => tb.id === 'all' || c.info.layers.includes(tb.id));
    const b = el('button', { class: 'ltab', type: 'button', role: 'tab', 'aria-selected': String(state.view === tb.id),
      'data-cand': candHere ? '1' : null, 'data-clash': clashHere ? '1' : null,
      onclick: () => { state.view = tb.id; renderLayerTabs(); renderDoll(); } },
      tb.label, el('span', { class: 'n', text: String(n) }), el('span', { class: 'dot c' }), el('span', { class: 'dot x' }));

  }));
}

// ================================================================ picker
function fitText(item) {
  const cl = clashesOf(item, state.outfits[state.active]);
  return { cl, worn: state.outfits[state.active].some(e => e.def === item.def) };
}
function renderPicker() {
  const q = state.search.trim().toLowerCase();
  const list = document.getElementById('plist');
  const rows = [];
  let lastGroup = null;
  for (const item of APPAREL) {
    if (state.group !== 'all' && item.group !== state.group) continue;
    if (state.layerFilter !== 'any' && !item.apparel.layers.includes(state.layerFilter)) continue;
    if (q && !item.label.toLowerCase().includes(q) && !item.token.includes(q)) continue;
    const { cl, worn } = fitText(item);
    if (state.fitOnly && (cl.length || worn)) continue;
    const sig = layerSig(item).text;
    if (sig !== lastGroup) { rows.push(el('div', { class: 'ghead', text: sig })); lastGroup = sig; }
    const badge = worn ? el('span', { class: 'badge worn', text: 'worn' })
      : cl.length ? el('span', { class: 'badge swap', text: 'swaps ' + cl.length, 'data-tip': 'Would take off: ' + cl.map(c => entryLabel(c.entry)).join(', ') })
      : el('span', { class: 'badge fits', text: 'fits' });
    rows.push(el('button', { class: 'prow', type: 'button', 'aria-current': String(!!state.cand && state.cand.def === item.def),
      onmouseenter: () => { state.hover = item.def; renderPreview(); },
      onmouseleave: () => { state.hover = null; renderPreview(); },
      onclick: () => selectCandidate(item.def) },
      el('span', { class: 'nm', text: itemName(item.label) }), badge));
  }
  list.replaceChildren(...(rows.length ? rows : [el('div', { class: 'empty', text: 'Nothing matches.' })]));
}
function selectCandidate(def, mat, q) {
  const item = byDef[def];
  const keep = state.cand && state.cand.def === def ? state.cand : null;
  state.cand = keep && mat === undefined ? keep : {
    def,
    mat: item.madeFromStuff ? (item.mats.includes(mat) ? mat : defMat(item)) : '',
    q: item.hasQuality && QUALITY_ORDER.includes(q) ? q : 'std' };
  state.hover = null;
  renderPicker(); renderCand(); renderPreview();
}

// ================================================================ candidate bar
function matSelect(item, value, onChange, q) {

    ...orderedMats(item).map(m => el('option', { value: m,

}
function qualSelect(item, value, onChange, mat) {
  const sel = el('select', { class: 'field', 'aria-label': 'Quality', onchange: e => onChange(e.target.value) },
    ...QUALITY_ORDER.map(q => el('option', { value: q, text: QUALITY_LABEL[q] + '  ·  ' + priceOf(item, mat, q).toLocaleString() })));

}
function statChips(st) {
  const c = [];
  for (const t of TYPES) if (st[t] !== undefined) c.push(el('span', { class: 'chipstat' }, TYPE_LABEL[t] + ' ', el('b', { text: pctTxt(st[t]) })));
  if (st.cold) c.push(el('span', { class: 'chipstat' }, 'Cold ', el('b', { text: st.cold.toFixed(1) + '°C' })));
  if (st.warm) c.push(el('span', { class: 'chipstat' }, 'Heat ins. ', el('b', { text: st.warm.toFixed(1) + '°C' })));

}
function renderCand() {
  const host = document.getElementById('cand');
  const c = state.cand;
  state.live.delete('candFocus');   // the controls are rebuilt below, so any focus on them is gone
  host.className = 'candbar' + (c ? ' on' : '');
  if (!c) {
    host.replaceChildren(el('div', { class: 'muted', text: 'Hover a piece on the left to peek at where it would sit, or click it to try it on. Green “fits” means nothing in the way; orange means something would have to come off.' }));
    return;
  }
  const item = byDef[c.def], st = compute(item, c.mat, c.q);
  const out = state.outfits[state.active];
  const cl = clashesOf(item, out);
  if (cl.length) host.classList.add('clash');
  const kids = [];
  kids.push(el('div', { class: 'row-between' },
    el('div', { class: 'ttl', text: itemName(item.label) }),
    el('div', { class: 'gold', text: coins(priceOf(item, c.mat, c.q)) })));
  const sels = el('div', { class: 'line' });
  if (item.madeFromStuff) sels.append(el('label', { class: 'small muted' }, 'Material ', matSelect(item, c.mat, v => { c.mat = v; renderCand(); renderPreview(); }, c.q)));
  if (item.hasQuality) sels.append(el('label', { class: 'small muted' }, 'Quality ', qualSelect(item, c.q, v => { c.q = v; renderCand(); renderPreview(); }, c.mat)));
  sels.append(...statChips(st));

  } catch (e) {
    document.querySelector('main').replaceChildren(el('p', { class: 'empty', text: location.protocol === 'file:'
      ? 'This page loads its data with a web request, so it has to be served rather than opened from disk. Run "py -m http.server 8765" in the repo root and open http://localhost:8765/calculator/paperdoll/ instead.'
      : 'Could not load the data. Try refreshing.' }));

  }
  for (const q of DATA.qualities) PRICE_QUALITY[q.id] = q.factor;

  const groups = [['all', 'All'], ['armor', 'Armor'], ['clothing', 'Clothing']];

  document.getElementById('fitonly').addEventListener('change', e => { state.fitOnly = e.target.checked; renderPicker(); });

  // restore: a shared link wins, then whatever this browser had last
  const q = new URLSearchParams(location.search);
  if (q.has('a') || q.has('b')) loadParams(location.search);
  else { let saved = ''; try { saved = localStorage.getItem(STORE_KEY) || ''; } catch (e) { /* none */ } loadParams(saved); }

    if (state.cand.def && state.cand.mat === '' && it.madeFromStuff) state.cand.mat = defMat(it);
  }
  document.getElementById('footer').textContent = 'Clashes follow the game’s own rule: two pieces can’t be worn together when they share an apparel layer and cover a common body part. Body, layers and hit chances come from RimWorld ' +
    DATA.gameVersion + '. Materials, qualities and prices match the Gear Calculator. Data updated ' + DATA.generated + '.';
  const liveZone = (node, token) => {
    node.addEventListener('mouseenter', () => { state.live.add(token); renderPreview(); });
    node.addEventListener('mouseleave', () => { state.live.delete(token); state.live.delete('arrived'); renderPreview(); });
  };
  liveZone(document.getElementById('picker'), 'picker');
  const candHost = document.getElementById('cand');
  liveZone(candHost, 'candHover');
  candHost.addEventListener('focusin', () => { state.live.add('candFocus'); renderPreview(); });
  candHost.addEventListener('focusout', e => { if (!candHost.contains(e.relatedTarget)) { state.live.delete('candFocus'); renderPreview(); } });
  renderAll();
}
boot();
</script>
</body>
</html>
